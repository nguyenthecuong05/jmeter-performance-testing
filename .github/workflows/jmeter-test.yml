
name: JMeter Performance Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jmeter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JMeter
        run: |
          curl -fL --retry 3 \
            https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz \
            -o /tmp/jmeter.tgz
          tar -xzf /tmp/jmeter.tgz -C /tmp

      - name: Run JMeter test
        run: |
          mkdir -p results
          /tmp/apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t test-plan/example-website-load-test.jmx \
            -l results/results.jtl \
            -e \
            -o results/html-report

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/
          if-no-files-found: warn
